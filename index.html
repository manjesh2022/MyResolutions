<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yearly Resolutions Tracker</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-indigo-500 selection:text-white">

    <!-- Header Section (Compact Navigation & Controls) -->
    <header class="bg-slate-900/90 backdrop-blur-md border-b border-slate-800/80 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-3 flex flex-col md:flex-row items-center justify-between gap-3">
            
            <!-- Left: Logo & Year Tabs -->
            <div class="flex items-center space-x-4 w-full md:w-auto justify-between md:justify-start">
                <div class="flex items-center space-x-2.5">
                    <div class="bg-indigo-600 p-2 rounded-xl shadow-lg shadow-indigo-500/30">
                        <i class="fa-solid fa-bullseye text-white text-base"></i>
                    </div>
                    <span class="font-bold tracking-tight text-sm">Resolution Hub</span>
                </div>
                
                <!-- Year Tabs -->
                <div id="year-tabs" class="flex space-x-1 bg-slate-950 border border-slate-800 p-1 rounded-xl">
                    <!-- Dynamically populated -->
                </div>
            </div>

            <!-- Right: Search, Category Filter, Status Filter & Actions -->
            <div class="flex flex-wrap items-center gap-2 w-full md:w-auto justify-end">
                <!-- Search Input -->
                <div class="relative flex-grow sm:flex-grow-0 sm:w-40">
                    <i class="fa-solid fa-search absolute left-3 top-2.5 text-slate-500 text-[11px]"></i>
                    <input type="text" id="search-input" placeholder="Search..." oninput="handleSearch(this.value)"
                        class="w-full bg-slate-950 border border-slate-800 rounded-xl pl-8 pr-3 py-1.5 text-xs text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition">
                </div>

                <!-- Category Filter -->
                <select id="category-filter" onchange="handleCategoryFilter(this.value)" class="bg-slate-950 border border-slate-800 rounded-xl px-3 py-1.5 text-xs text-slate-300 focus:outline-none focus:border-indigo-500 transition cursor-pointer">
                    <option value="all">📁 All Categories</option>
                    <option value="General">General</option>
                    <option value="Health & Fitness">Health & Fitness</option>
                    <option value="Learning & Skills">Learning & Skills</option>
                    <option value="Shopping & Tech">Shopping & Tech</option>
                    <option value="Travel & Trips">Travel & Trips</option>
                    <option value="Entertainment">Entertainment</option>
                </select>

                <!-- Status Filter Pills -->
                <div class="flex space-x-1 bg-slate-950 border border-slate-800 p-0.5 rounded-xl text-xs">
                    <button onclick="setStatusFilter('all')" id="filter-all" class="px-2.5 py-1 rounded-lg bg-indigo-600 text-white font-medium transition">All</button>
                    <button onclick="setStatusFilter('active')" id="filter-active" class="px-2.5 py-1 rounded-lg text-slate-400 hover:text-white transition">Active</button>
                    <button onclick="setStatusFilter('completed')" id="filter-completed" class="px-2.5 py-1 rounded-lg text-slate-400 hover:text-white transition">Done</button>
                </div>

                <!-- Data Backup / Restore Buttons -->
                <div class="flex items-center space-x-1 bg-slate-950 border border-slate-800 p-1 rounded-xl">
                    <button onclick="exportData()" class="text-slate-400 hover:text-white px-2 py-1 text-xs transition cursor-pointer" title="Export JSON Backup">
                        <i class="fa-solid fa-download"></i>
                    </button>
                    <label class="text-slate-400 hover:text-white px-2 py-1 text-xs transition cursor-pointer" title="Import JSON Backup">
                        <i class="fa-solid fa-upload"></i>
                        <input type="file" id="import-file" accept=".json" onchange="importData(event)" class="hidden">
                    </label>
                </div>

                <!-- Add Button -->
                <button onclick="openModal()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-3.5 py-1.5 rounded-xl transition shadow-lg shadow-indigo-600/20 flex items-center gap-1.5 cursor-pointer text-xs flex-shrink-0">
                    <i class="fa-solid fa-plus-circle"></i> Add Resolution
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-4xl w-full mx-auto px-4 py-8 flex-grow">
        
        <!-- Resolution List Section -->
        <section class="bg-slate-900/40 border border-slate-800/60 rounded-2xl p-6 backdrop-blur-sm shadow-xl">
            <div class="flex items-center justify-between mb-6 pb-4 border-b border-slate-800/80">
                <div>
                    <h2 id="current-year-title" class="text-xl font-bold text-slate-100 flex items-center gap-2.5">
                        <!-- Dynamic Title -->
                    </h2>
                    <p class="text-xs text-slate-400 mt-0.5">Manage and check off your targets for the selected year</p>
                </div>

                <!-- Stats Pill -->
                <div class="flex items-center space-x-2 bg-slate-950 border border-slate-800 px-3 py-1.5 rounded-full text-xs font-medium text-slate-300">
                    <i class="fa-solid fa-trophy text-amber-400"></i>
                    <span id="completed-count">0</span>/<span id="total-count">0</span> (<span id="completion-pct">0%</span>)
                </div>
            </div>

            <!-- Empty State -->
            <div id="empty-state" class="hidden text-center py-12 border border-dashed border-slate-800 rounded-xl">
                <i class="fa-solid fa-compass text-slate-600 text-4xl mb-3"></i>
                <p class="text-slate-400 font-medium">No resolutions match your search or filter.</p>
                <p class="text-slate-600 text-sm mt-1">Try resetting filters or add a new goal!</p>
            </div>

            <!-- List Container -->
            <div id="resolutions-list" class="space-y-3">
                <!-- Dynamic Items -->
            </div>
        </section>

    </main>

    <!-- Add/Edit Resolution Modal -->
    <div id="resolution-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-lg p-6 shadow-2xl relative">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-lg font-semibold flex items-center gap-2">
                    <i class="fa-solid fa-wand-magic-sparkles text-indigo-400"></i> <span id="modal-title">New Resolution</span>
                </h3>
                <button onclick="closeModal()" class="text-slate-500 hover:text-slate-300 transition p-1">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <form id="resolution-form" class="space-y-4">
                <input type="hidden" id="resolution-id">
                <div>
                    <label for="resolution-text" class="block text-xs font-medium text-slate-400 uppercase tracking-wider mb-1">What is your goal?</label>
                    <input type="text" id="resolution-text" required placeholder="e.g., Learn Swimming, Clear JLPT N2..." 
                        class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-slate-100 placeholder-slate-600 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition text-sm">
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <div>
                        <label for="resolution-year" class="block text-xs font-medium text-slate-400 uppercase tracking-wider mb-1">Year</label>
                        <select id="resolution-year" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-slate-100 focus:outline-none focus:border-indigo-500 text-sm">
                            <option value="2026">2026</option>
                            <option value="2025">2025</option>
                        </select>
                    </div>
                    <div>
                        <label for="resolution-month" class="block text-xs font-medium text-slate-400 uppercase tracking-wider mb-1">Month (Optional)</label>
                        <select id="resolution-month" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-slate-100 focus:outline-none focus:border-indigo-500 text-sm">
                            <option value="">None / Ongoing</option>
                            <option value="01">01 - January</option>
                            <option value="02">02 - February</option>
                            <option value="03">03 - March</option>
                            <option value="04">04 - April</option>
                            <option value="05">05 - May</option>
                            <option value="06">06 - June</option>
                            <option value="07">07 - July</option>
                            <option value="08">08 - August</option>
                            <option value="09">09 - September</option>
                            <option value="10">10 - October</option>
                            <option value="11">11 - November</option>
                            <option value="12">12 - December</option>
                        </select>
                    </div>
                    <div>
                        <label for="resolution-category" class="block text-xs font-medium text-slate-400 uppercase tracking-wider mb-1">Category</label>
                        <select id="resolution-category" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-slate-100 focus:outline-none focus:border-indigo-500 text-sm">
                            <option value="General">General</option>
                            <option value="Health & Fitness">Health & Fitness</option>
                            <option value="Learning & Skills">Learning & Skills</option>
                            <option value="Shopping & Tech">Shopping & Tech</option>
                            <option value="Travel & Trips">Travel & Trips</option>
                            <option value="Entertainment">Entertainment</option>
                        </select>
                    </div>
                </div>

                <div class="flex items-center space-x-2 pt-2">
                    <input type="checkbox" id="resolution-completed" class="w-4 h-4 rounded bg-slate-950 border-slate-800 text-indigo-600 focus:ring-indigo-500">
                    <label for="resolution-completed" class="text-xs text-slate-300 font-medium">Mark as completed / achieved</label>
                </div>

                <div class="flex items-center justify-end space-x-3 pt-4 border-t border-slate-800">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl border border-slate-800 text-slate-400 hover:text-white transition text-xs font-medium cursor-pointer">Cancel</button>
                    <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-5 py-2 rounded-xl transition shadow-lg shadow-indigo-600/20 text-xs cursor-pointer">Save Resolution</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <footer class="border-t border-slate-800/80 py-6 text-center text-xs text-slate-500">
        <p>Stay focused on your journey. One goal at a time.</p>
    </footer>

    <!-- App Logic Script -->
    <script>
        const defaultResolutions = [
            // 2026 Fully Synchronized List
            { id: 170000002601, year: "2026", text: "Karya Siddhi Anjaneya Temple", month: "08", category: "Travel & Trips", completed: false },

            { id: 170000002610, year: "2026", text: "Trip - Bijapur", month: "05", category: "Travel & Trips", completed: true },
            { id: 170000002611, year: "2026", text: "Trip - Mantralaya", month: "07", category: "Travel & Trips", completed: true },
            { id: 170000002612, year: "2026", text: "Trip - Srisailam", month: "07", category: "Travel & Trips", completed: true },
            { id: 170000002613, year: "2026", text: "Travel solo - Tumkur", month: "07", category: "Travel & Trips", completed: true },

            { id: 170000002616, year: "2026", text: "Read Books - I Don't Love You Anymore", month: "07", category: "General", completed: true },
            { id: 170000002617, year: "2026", text: "Weekly temple visit", month: "", category: "General", completed: false },
            { id: 170000002618, year: "2026", text: "Learn Swimming", month: "", category: "Learning & Skills", completed: false },
            { id: 170000002619, year: "2026", text: "日本語教え (Teach Japanese)", month: "", category: "Learning & Skills", completed: false },
            { id: 170000002620, year: "2026", text: "Try Japanese Food", month: "", category: "General", completed: false },
            { id: 170000002621, year: "2026", text: "Step in flight", month: "", category: "Travel & Trips", completed: false },
            { id: 170000002622, year: "2026", text: "iPhone / New Phone / OnePlus 13s", month: "09", category: "Shopping & Tech", completed: false },
            { id: 170000002623, year: "2026", text: "Invest in Gold", month: "", category: "Shopping & Tech", completed: false },
            { id: 170000002624, year: "2026", text: "Complete Chanting Balances", month: "", category: "General", completed: false },
            { id: 170000002625, year: "2026", text: "Prepare for SSC CGL", month: "", category: "Learning & Skills", completed: false },

            // 2025
            { id: 170000002501, year: "2025", text: "Try to avoid Non Veg", month: "", category: "Health & Fitness", completed: false },
            { id: 170000002502, year: "2025", text: "Try Japanese Food", month: "", category: "General", completed: false },
            { id: 170000002503, year: "2025", text: "Complete all the Chanting Balances", month: "", category: "General", completed: false },
            { id: 170000002504, year: "2025", text: "Learn Swimming", month: "", category: "Learning & Skills", completed: false },
            { id: 170000002505, year: "2025", text: "Go to GYM and gain MUSCLE", month: "", category: "Health & Fitness", completed: false },
            { id: 170000002506, year: "2025", text: "Read Books", month: "", category: "General", completed: false },
            { id: 170000002507, year: "2025", text: "Get a DL", month: "", category: "General", completed: false },
            { id: 170000002508, year: "2025", text: "Clear JLPT N3", month: "01", category: "Learning & Skills", completed: true },
            { id: 170000002509, year: "2025", text: "Buy clothes - Glitch, Anusha Marriage", month: "", category: "Shopping & Tech", completed: true },
            { id: 170000002510, year: "2025", text: "Travel - Bannerghatta", month: "01", category: "Travel & Trips", completed: true },
            { id: 170000002511, year: "2025", text: "Travel - Kotilinga", month: "02", category: "Travel & Trips", completed: true },
            { id: 170000002512, year: "2025", text: "Travel - Ahobilam", month: "03", category: "Travel & Trips", completed: true },
            { id: 170000002513, year: "2025", text: "Travel - Srirangpatna", month: "03", category: "Travel & Trips", completed: true },
            { id: 170000002514, year: "2025", text: "Travel - Dharmasthala", month: "04", category: "Travel & Trips", completed: true },
            { id: 170000002515, year: "2025", text: "Travel - Gowdgere", month: "07", category: "Travel & Trips", completed: true },
            { id: 170000002516, year: "2025", text: "Travel - Kerala", month: "08", category: "Travel & Trips", completed: true },
            { id: 170000002517, year: "2025", text: "Buy Casio Watch - Casio 1200, Casio A168", month: "", category: "Shopping & Tech", completed: true }
        ];

        let resolutions = JSON.parse(localStorage.getItem('resolutions_v5')) || defaultResolutions;
        let currentYear = '2026';
        let currentStatusFilter = 'all';
        let searchQuery = '';
        let currentCategoryFilter = 'all';

        const yearTabsContainer = document.getElementById('year-tabs');
        const currentYearTitle = document.getElementById('current-year-title');
        const listContainer = document.getElementById('resolutions-list');
        const emptyState = document.getElementById('empty-state');
        const completedCountEl = document.getElementById('completed-count');
        const totalCountEl = document.getElementById('total-count');
        const completionPctEl = document.getElementById('completion-pct');
        const modal = document.getElementById('resolution-modal');
        const resolutionForm = document.getElementById('resolution-form');

        function saveAndRender() {
            localStorage.setItem('resolutions_v5', JSON.stringify(resolutions));
            render();
        }

        function setYear(year) {
            currentYear = year;
            render();
        }

        function setStatusFilter(filter) {
            currentStatusFilter = filter;
            ['all', 'active', 'completed'].forEach(f => {
                const btn = document.getElementById(`filter-${f}`);
                if (f === filter) {
                    btn.className = "px-2.5 py-1 rounded-lg bg-indigo-600 text-white font-medium transition";
                } else {
                    btn.className = "px-2.5 py-1 rounded-lg text-slate-400 hover:text-white transition";
                }
            });
            render();
        }

        function handleSearch(query) {
            searchQuery = query.toLowerCase().trim();
            render();
        }

        function handleCategoryFilter(cat) {
            currentCategoryFilter = cat;
            render();
        }

        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(resolutions, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `resolutions_backup_${new Date().toISOString().slice(0,10)}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function importData(event) {
            const fileReader = new FileReader();
            if (event.target.files[0]) {
                fileReader.readAsText(event.target.files[0], "UTF-8");
                fileReader.onload = (e) => {
                    try {
                        const imported = JSON.parse(e.target.result);
                        if (Array.isArray(imported)) {
                            resolutions = imported;
                            saveAndRender();
                            alert("Resolutions imported successfully!");
                        } else {
                            alert("Invalid JSON format.");
                        }
                    } catch (error) {
                        alert("Error parsing JSON file.");
                    }
                };
            }
        }

        function openModal(id = null) {
            modal.classList.remove('hidden');
            document.getElementById('resolution-year').value = currentYear;
            if (id) {
                document.getElementById('modal-title').textContent = "Edit Resolution";
                const res = resolutions.find(r => r.id === id);
                if (res) {
                    document.getElementById('resolution-id').value = res.id;
                    document.getElementById('resolution-text').value = res.text;
                    document.getElementById('resolution-year').value = res.year;
                    document.getElementById('resolution-month').value = res.month || '';
                    document.getElementById('resolution-category').value = res.category || 'General';
                    document.getElementById('resolution-completed').checked = res.completed;
                }
            } else {
                document.getElementById('modal-title').textContent = "New Resolution";
                resolutionForm.reset();
                document.getElementById('resolution-year').value = currentYear;
                document.getElementById('resolution-id').value = '';
            }
        }

        function closeModal() {
            modal.classList.add('hidden');
        }

        resolutionForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const id = document.getElementById('resolution-id').value;
            const text = document.getElementById('resolution-text').value.trim();
            const year = document.getElementById('resolution-year').value;
            const month = document.getElementById('resolution-month').value;
            const category = document.getElementById('resolution-category').value;
            const completed = document.getElementById('resolution-completed').checked;

            if (!text) return;

            if (id) {
                resolutions = resolutions.map(r => r.id == id ? { ...r, text, year, month, category, completed } : r);
            } else {
                resolutions.unshift({ id: Date.now(), text, year, month, category, completed });
            }

            closeModal();
            saveAndRender();
        });

        function toggleResolution(id) {
            resolutions = resolutions.map(res => res.id === id ? { ...res, completed: !res.completed } : res);
            saveAndRender();
        }

        function deleteResolution(id) {
            resolutions = resolutions.filter(res => res.id !== id);
            saveAndRender();
        }

        function getMonthName(m) {
            const months = {
                "01": "Jan", "02": "Feb", "03": "Mar", "04": "Apr", 
                "05": "May", "06": "Jun", "07": "Jul", "08": "Aug", 
                "09": "Sep", "10": "Oct", "11": "Nov", "12": "Dec"
            };
            return months[m] || '';
        }

        function render() {
            const uniqueYears = [...new Set(resolutions.map(r => r.year))].sort().reverse();
            if (!uniqueYears.includes(currentYear) && uniqueYears.length > 0) {
                currentYear = uniqueYears[0];
            }

            yearTabsContainer.innerHTML = '';
            uniqueYears.forEach(y => {
                const btn = document.createElement('button');
                btn.className = `px-3 py-1 rounded-lg text-xs font-semibold transition whitespace-nowrap ${y === currentYear ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-400 hover:text-white'}`;
                btn.textContent = `${y}`;
                btn.onclick = () => setYear(y);
                yearTabsContainer.appendChild(btn);
            });

            currentYearTitle.innerHTML = `<i class="fa-regular fa-calendar-days text-indigo-400"></i> ${currentYear} Targets`;

            const yearResolutions = resolutions.filter(r => r.year === currentYear);
            
            let filtered = yearResolutions.filter(r => {
                const matchesStatus = currentStatusFilter === 'all' || 
                    (currentStatusFilter === 'active' && !r.completed) || 
                    (currentStatusFilter === 'completed' && r.completed);
                
                const matchesSearch = searchQuery === '' || r.text.toLowerCase().includes(searchQuery);
                const matchesCategory = currentCategoryFilter === 'all' || r.category === currentCategoryFilter;

                return matchesStatus && matchesSearch && matchesCategory;
            });

            const total = yearResolutions.length;
            const completed = yearResolutions.filter(r => r.completed).length;
            const pct = total > 0 ? Math.round((completed / total) * 100) : 0;

            completedCountEl.textContent = completed;
            totalCountEl.textContent = total;
            completionPctEl.textContent = `${pct}%`;

            if (filtered.length === 0) {
                emptyState.classList.remove('hidden');
            } else {
                emptyState.classList.add('hidden');
            }

            listContainer.innerHTML = '';
            filtered.forEach(res => {
                const item = document.createElement('div');
                item.className = `flex items-center justify-between bg-slate-900 border ${res.completed ? 'border-slate-800/40 opacity-75' : 'border-slate-800'} rounded-xl p-4 transition hover:border-slate-700`;
                
                const monthStr = res.month ? `<span class="inline-flex items-center text-[10px] text-indigo-400 bg-indigo-950/60 border border-indigo-900/40 px-2 py-0.5 rounded-md font-medium"><i class="fa-regular fa-calendar mr-1"></i>${getMonthName(res.month)}</span>` : '';
                
                item.innerHTML = `
                    <div class="flex items-start space-x-3.5 overflow-hidden pr-2">
                        <button onclick="toggleResolution(${res.id})" class="mt-0.5 flex-shrink-0 w-5 h-5 rounded-lg border ${res.completed ? 'bg-indigo-600 border-indigo-600 text-white' : 'border-slate-700 bg-slate-950'} flex items-center justify-center transition cursor-pointer">
                            ${res.completed ? '<i class="fa-solid fa-check text-xs"></i>' : ''}
                        </button>
                        <div class="overflow-hidden">
                            <p class="text-sm font-medium ${res.completed ? 'line-through text-slate-500' : 'text-slate-200'}">${escapeHTML(res.text)}</p>
                            <div class="flex flex-wrap items-center gap-2 mt-1.5">
                                <span class="inline-block text-[10px] bg-slate-800 text-slate-300 px-2 py-0.5 rounded-md font-medium">${res.category || 'General'}</span>
                                ${monthStr}
                            </div>
                        </div>
                    </div>
                    <div class="flex items-center space-x-1 flex-shrink-0">
                        <button onclick="openModal(${res.id})" class="text-slate-600 hover:text-indigo-400 p-2 transition cursor-pointer" title="Edit">
                            <i class="fa-solid fa-pen text-xs"></i>
                        </button>
                        <button onclick="deleteResolution(${res.id})" class="text-slate-600 hover:text-red-400 p-2 transition cursor-pointer" title="Delete">
                            <i class="fa-solid fa-trash-can text-xs"></i>
                        </button>
                    </div>
                `;
                listContainer.appendChild(item);
            });
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        render();
    </script>
</body>
</html>
